<div class="container py-5">
    <div class="card card-container">
        <div class="profile-pic">
            <label class="hoverable" for="fileInput">
                <img id="profile-img" class="profile-img-card" alt="Profile photo" [src]="url ? url :'//ssl.gstatic.com/accounts/ui/avatar_2x.png'" />
                <div class="hover-text">Change Picture</div>
                <div class="background"></div>
            </label>
            <br/>
            <input id="fileInput" type="file" aria-label="Upload profile photo" (change)="onSelectFile($event)">
        </div>
        <form *ngIf="user" (ngSubmit)="updateProfile()" class="form-signin">
            <div class="error-message" role="alert">{{ message }}</div>
            <label class="visually-hidden" for="first-name">First name</label>
            <input type="text" [(ngModel)]="user.first" name="first" id="first-name" class="form-control" autocomplete="given-name" [value]="user.first">
            <label class="visually-hidden" for="last-name">Last name</label>
            <input type="text" [(ngModel)]="user.last" name="last" id="last-name" class="form-control" autocomplete="family-name" [value]="user.last">
            <label class="visually-hidden" for="inputEmail">Email</label>
            <input type="email" [(ngModel)]="user.email" name="email" id="inputEmail" class="form-control" autocomplete="email" [value]="user.email" readonly>
            <label class="visually-hidden" for="inputPassword">Current password</label>
            <input type="password" [(ngModel)]="oldPassword" name="oldPassword" id="inputPassword" class="form-control" placeholder="Old Password" autocomplete="current-password">
            <label class="visually-hidden" for="inputConfirmPassword">New password</label>
            <input type="password" [(ngModel)]="user.password" name="password" id="inputConfirmPassword" class="form-control" placeholder="New Password" autocomplete="new-password">
            <button class="btn btn-lg btn-success btn-block btn-signin" type="submit">Update Profile</button>
            <button class="btn btn-lg btn-success btn-block btn-signin" type="button" (click)="goToHome()">Cancel</button>
        </form><!-- /form -->
    </div><!-- /card-container -->
</div><!-- /container -->
